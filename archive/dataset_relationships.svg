<text x="590" y="1124" class="tag pk" text-anchor="end" >!</text>
<text x="602" y="1124" class="f" text-anchor="start" >orders fans out to items, payments and reviews - aggregate each before joining together</text>
<text x="590" y="1146" class="tag pk" text-anchor="end" >!</text>
<text x="602" y="1146" class="f" text-anchor="start" >review_id is not unique alone (814 repeats); key is (review_id, order_id)</text>
